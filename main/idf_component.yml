## IDF Component Manager Manifest File
dependencies:
  # Match esp_speaker's BMI270 any-motion gesture used by the Emote home.
  espressif2022/bmi270:
    version: "^1.1.0~2"

  # Match esp_speaker's GPIO43 head-LED feedback for Wi-Fi and touch.
  espressif/led_indicator:
    version: "^2.1.2"

  # The 0.1.0 touch_button package currently resolves incompatible transitive
  # FSM versions on ESP-IDF 6.1. Use the IDF-6-compatible low-level driver and
  # keep the VoCat click/long-press state machine in the application.
  espressif/touch_sensor_lowlevel:
    version: "^1.0.1"

  # Match esp_speaker Developer Mode: expose the VoCat SD card over USB MSC.
  espressif/esp_tinyusb:
    version: "^2.0.0"

  # The main component creates the littlefs_data partition image directly.
  joltwallet/littlefs:
    version: "1.*"

  # 0.8.4 contains the packaged ESP-IDF CMake fix; 0.8.5 expects unreleased HAL headers.
  espressif/brookesia_service_helper:
    version: "0.8.4"

  # Hal
  espressif/brookesia_hal_adaptor:
    version: "0.8.*"
  espressif/brookesia_hal_boards:
    version: "0.8.*"

  # Services
  espressif/brookesia_service_device:
    version: "0.8.*"
  espressif/brookesia_service_audio:
    version: "0.8.*"
  espressif/brookesia_service_wifi:
    version: "0.8.*"
  espressif/brookesia_service_display:
    version: "0.8.*"
  espressif/brookesia_service_video:
    version: "0.8.*"

  # Agents
  espressif/brookesia_agent_coze:
    version: "0.8.*"
  espressif/brookesia_agent_openai:
    version: "0.8.*"
  espressif/brookesia_agent_xiaozhi:
    version: "0.8.*"
    # Cancel XiaoZhi's delayed audio-channel open while the boot-idle state is
    # armed, without changing the original Half-Duplex conversation flow.
    override_path: "../components/brookesia_agent_xiaozhi"

  # Expressions
  espressif/brookesia_expression_emote:
    version: "0.8.*"

  # GUI
  espressif/brookesia_gui_lvgl:
    version: "0.8.*"
    override_path: "../components/brookesia_gui_lvgl"
