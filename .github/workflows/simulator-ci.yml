name: ESP Chatbot CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: esp-chatbot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Linux simulator regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out project
        uses: actions/checkout@v7

      - name: Check out ESP-Brookesia
        uses: actions/checkout@v7
        with:
          repository: espressif/esp-brookesia
          ref: 2c09459a97a82c8d477c543eb2b43f4956b8a5be
          path: _deps/esp-brookesia

      - name: Check out LVGL 9.5.0
        uses: actions/checkout@v7
        with:
          repository: lvgl/lvgl
          ref: 85aa60d18b3d5e5588d7b247abf90198f07c8a63
          path: _deps/lvgl

      - name: Install Linux simulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            imagemagick \
            libboost-all-dev \
            libsdl2-dev \
            libssl-dev \
            ninja-build \
            pkg-config

      - name: Configure simulator
        run: |
          cmake -S host_sim -B build-host-ci -G Ninja \
            -DBROOKESIA_SOURCE_DIR="${GITHUB_WORKSPACE}/_deps/esp-brookesia" \
            -DLVGL_SOURCE_DIR="${GITHUB_WORKSPACE}/_deps/lvgl" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Run release regression gate
        run: |
          host_sim/tests/regression_gate.sh \
            build-host-ci \
            .local-artifacts/ci-parity

      - name: Upload visual diffs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: simulator-visual-diffs
          path: .local-artifacts/ci-parity/
          if-no-files-found: ignore
          retention-days: 7

  firmware:
    name: ESP VoCat firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      IDF_TARGET: esp32s3
    container:
      image: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c

    steps:
      - name: Check out project
        uses: actions/checkout@v7

      - name: Report ESP-IDF version
        run: |
          source /opt/esp/idf/export.sh
          idf.py --version

      - name: Generate VoCat board configuration
        run: |
          source /opt/esp/idf/export.sh
          cp dependencies.lock /tmp/dependencies.lock
          idf.py gen-bmgr-config -b esp_vocat_board_v1_0
          cp /tmp/dependencies.lock dependencies.lock

      - name: Build firmware
        run: |
          source /opt/esp/idf/export.sh
          idf.py -B build-idf-ci \
            -DSDKCONFIG=sdkconfig.ci.board.esp_vocat_board_v1_0 \
            build

      - name: Verify dependency lock is stable
        run: git diff --exit-code -- dependencies.lock

      - name: Report firmware size
        run: |
          source /opt/esp/idf/export.sh
          idf.py -B build-idf-ci size
